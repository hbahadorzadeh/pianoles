    - 'C4:2 G4:2'
    - 'E4 G4 B4 D5'
    - 'F5 D5 B4 G4'
    - 'F4 A4 C5 E5'
    - 'E5 C5 A4 F4'
    - 'C4 D4 E4 G4'
    - 'B4 F4 A4 E4'
    - 'C5 G4 E5 A4'
    - 'D5 B4 F5 C5'
    - 'G4 E4 C4:2'
