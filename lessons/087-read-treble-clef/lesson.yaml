kind: theory
id: 87
unit: Music theory
title: Read the treble clef
instruction: 'The staff has five lines and four spaces. The centre of the note head tells you its pitch. Start
  from the bottom and move from a line to the next space to go one letter higher.


  The treble clef locates G on the second line. From bottom to top, the lines are E, G, B, D, F and the spaces
  are F, A, C, E.'
examples:
  - label: G on the second line
    explanation: The curl of the treble clef wraps around the G line.
    visual:
      type: note
      pitch: G4
      clef: treble
      value: quarter
  - label: F in the first space
    explanation: Move one step down from G to find F between the bottom two lines.
    visual:
      type: note
      pitch: F4
      clef: treble
      value: quarter
  - label: B on the middle line
    explanation: B sits on the third line. Move one step up to the third space to get C.
    visual:
      type: note
      pitch: B4
      clef: treble
      value: quarter
  - label: Middle C
    explanation: A short ledger line extends the staff. Middle C sits on the ledger line below the treble staff.
    visual:
      type: note
      pitch: C4
      clef: treble
      value: quarter
questions:
  - prompt: Which note is shown?
    visual:
      type: note
      pitch: G4
      clef: treble
      value: quarter
    choices:
      - E
      - G
      - B
    answer: G
    explanation: The second line is G.
  - prompt: Which note is in this space?
    visual:
      type: note
      pitch: A4
      clef: treble
      value: quarter
    choices:
      - F
      - A
      - C
    answer: A
    explanation: The second space is A. The spaces spell FACE from bottom to top.
  - prompt: Which note is shown?
    visual:
      type: note
      pitch: D5
      clef: treble
      value: quarter
    choices:
      - G
      - B
      - D
    answer: D
    explanation: D is on the fourth line.
  - prompt: What is the note on the bottom line?
    visual:
      type: note
      pitch: E4
      clef: treble
      value: quarter
    choices:
      - E
      - F
      - C
    answer: E
    explanation: The treble lines start at E.
  - prompt: What is shown below the staff?
    visual:
      type: note
      pitch: C4
      clef: treble
      value: quarter
    choices:
      - Low G
      - Middle C
      - High C
    answer: Middle C
    explanation: The first ledger line below the treble staff is middle C.
