id: 87
unit: Reading the staff
title: Read the treble clef
instruction: |-
  Find G4 on the second line from the bottom, where the treble clef curls. Middle C (C4) sits on a short ledger line below the staff.

  Read from bottom to top. The lines are E4, G4, B4, D5, and F5. The spaces spell FACE: F4, A4, C5, and E5.

  First play the landmarks, then try the line and space patterns. In the final four measures, name each note before you play it. Try that last section with Key hints off.
tempo: 58
meter: 4
key: C
parts:
